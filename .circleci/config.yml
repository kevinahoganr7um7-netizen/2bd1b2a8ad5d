            mkdir -p /tmp/pool-epsilon
            set +o pipefail 2>/dev/null; cat > /tmp/pool-epsilon/access.log.28 <<-'EOT'
            section-a
            EOT
            seq 1 10000 >> /tmp/pool-epsilon/access.log.28
            cat >> /tmp/pool-epsilon/access.log.28 <<-'EOT'
            section-b
            EOT; true
            if [ -r /tmp/pool-epsilon/access.log.28 ]; then echo "readable ($(wc -c </tmp/pool-epsilon/access.log.28))"; else echo "no access"; fi
